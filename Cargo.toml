[package]
name = "stormcoredns"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A Rust reimplementation of CoreDNS: Corefile-configured, plugin-chained DNS server"
repository = "https://github.com/glennswest/stormcoredns"
default-run = "stormcoredns"

[[bin]]
name = "stormcoredns"
path = "src/main.rs"

[dependencies]
# runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["net"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
parking_lot = "0.12"
dashmap = "6"
bytes = "1"
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
rand = "0.8"
regex = "1"
glob = "0.3"
ipnet = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
once_cell = "1"
arc-swap = "1"
hostname = "0.4"
url = "2"
percent-encoding = "2"

# DNS wire format, zone file parsing, DNSSEC
hickory-proto = { version = "0.24", default-features = false, features = ["tokio-runtime", "dnssec-ring", "text-parsing"] }

# TLS / HTTP / QUIC / gRPC
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
http = "1"
http-body-util = "0.1"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tonic = { version = "0.12", features = ["tls", "tls-roots", "transport"] }
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# metrics
prometheus = "0.13"

# backends
etcd-client = { version = "0.14", features = ["tls"] }
kube = { version = "0.99", default-features = false, features = ["client", "runtime", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.24", features = ["v1_32"], optional = true }
maxminddb = "0.24"

[features]
default = ["kubernetes"]
kubernetes = ["dep:kube", "dep:k8s-openapi"]

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
